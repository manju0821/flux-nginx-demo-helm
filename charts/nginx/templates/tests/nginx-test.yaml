apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nginx.fullname" . }}-test"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: nginx-test
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          echo "Testing nginx service..."
          wget -q -O /dev/null http://{{ include "nginx.fullname" . }}:80
          echo "Nginx test PASSED"
